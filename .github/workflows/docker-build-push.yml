name: Build and Push Docker Image on Tag

on:
  push:
    tags:
      - 'v*'  # match all v prefix tag

env:
  REGISTRY_NAME: ${{ secrets.REGISTRY }}
  IMAGE_NAME: istio-jwt-test
  DOCKERFILE_PATH: "./Dockerfile"  # Dockerfile path demo: ./Dockerfile dir
  BUILD_CONTEXT: "./"  # build context app dir

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}  # checkout trigger tag

      - name: Extract Docker Tag
        id: extract-tag
        run: |
          # get tag name（cut refs/tags/ prefix）
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "DOCKER_TAG=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "Extracted tag: ${GITHUB_OUTPUT} -- ${TAG_NAME}"

      - name: Determine Branch and Image Name
        id: determine-branch
        run: |
          # obtain tag against tag
          COMMIT=$(git rev-list -n 1 ${{ github.ref }})
          echo "commit:  ${COMMIT} "
          BROUT=$(git branch -a --contains $COMMIT)
          echo "BROUT:  ${BROUT} "
          RESULT1 = $(git branch -a --contains $COMMIT | grep -Eq '(^|/)develop(/|$)')
          echo "RESULT1:  $?"

          # check tag belong to which branch
          if git branch -a --contains $COMMIT | grep -Eq '(^|/)develop(/|$)'; then
            echo "BRANCH_NAME=develop" >> $GITHUB_OUTPUT
            echo "IMAGE_NAME=mileage-dev-web-app" >> $GITHUB_OUTPUT
          else
            echo "BRANCH_NAME=unknown" >> $GITHUB_OUTPUT
            echo "::error::Tag is not on develop branch!"
            exit 1
          fi

